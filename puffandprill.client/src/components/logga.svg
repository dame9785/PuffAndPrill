<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Puff &amp; Prill logo">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6adf"></stop>
      <stop offset="100%" stop-color="#ff1493"></stop>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48d8ff"></stop>
      <stop offset="100%" stop-color="#0094ff"></stop>
    </linearGradient>

    <linearGradient id="vapeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2430"></stop>
      <stop offset="55%" stop-color="#0f1218"></stop>
      <stop offset="100%" stop-color="#2f3645"></stop>
    </linearGradient>

    <linearGradient id="tinOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3040"></stop>
      <stop offset="100%" stop-color="#090b10"></stop>
    </linearGradient>

    <linearGradient id="tinInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d24"></stop>
      <stop offset="100%" stop-color="#101319"></stop>
    </linearGradient>

    <radialGradient id="smokePink" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff4dc4" stop-opacity=".9"></stop>
      <stop offset="100%" stop-color="#ff4dc4" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="smokeBlue" cx="58%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#33cfff" stop-opacity=".9"></stop>
      <stop offset="100%" stop-color="#33cfff" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"></feDropShadow>
    </filter>
  </defs>

  <!-- smoke -->
  <ellipse cx="310" cy="150" rx="170" ry="120" fill="url(#smokePink)"></ellipse>
  <ellipse cx="490" cy="145" rx="180" ry="125" fill="url(#smokeBlue)"></ellipse>
  <ellipse cx="405" cy="230" rx="170" ry="70" fill="#000" opacity=".35"></ellipse>

  <!-- vape -->
  <g transform="translate(140 255) rotate(-18)" filter="url(#shadow)">
    <rect x="-35" y="-118" width="72" height="218" rx="24" fill="url(#vapeBody)"></rect>
    <rect x="-28" y="-110" width="56" height="40" rx="14" fill="#0c0f14"></rect>
    <rect x="-24" y="-104" width="48" height="3" rx="2" fill="#77829c" opacity=".5"></rect>
    <rect x="-3" y="-8" width="8" height="38" rx="4" fill="url(#blue)" filter="url(#glowBlue)"></rect>
  </g>

  <!-- text -->
  <g filter="url(#shadow)">
    <text x="405" y="165" text-anchor="middle" font-family="Brush Script MT, Segoe Script, Pacifico, cursive" font-size="120" font-weight="700" fill="url(#pink)" filter="url(#glowPink)">Puff</text>

    <text x="520" y="232" text-anchor="middle" font-family="Brush Script MT, Segoe Script, Pacifico, cursive" font-size="76" font-weight="700" fill="url(#pink)" filter="url(#glowPink)">&amp;</text>

    <text x="390" y="292" text-anchor="middle" font-family="Brush Script MT, Segoe Script, Pacifico, cursive" font-size="118" font-weight="700" fill="url(#blue)" filter="url(#glowBlue)">Prill</text>

    <path d="M235 310 C330 342, 500 336, 610 284" fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round" filter="url(#glowBlue)"></path>
  </g>

  <!-- tin -->
  <g transform="translate(625 285) rotate(-12)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="112" ry="78" fill="url(#tinOuter)"></ellipse>
    <ellipse cx="-5" cy="-5" rx="96" ry="66" fill="url(#tinInner)"></ellipse>
    <ellipse cx="-10" cy="-10" rx="78" ry="52" fill="#181b22"></ellipse>

    <text x="-10" y="-6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#fff">PUFF</text>
    <text x="-10" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#fff">&amp; PRILL</text>
    <text x="-10" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#c69047">SNUS</text>
  </g>
</svg>